*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,sans-serif;min-height:100vh}
a{color:var(--gold-d)}a:hover{color:var(--hot)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.page{max-width:1280px;margin:0 auto;background:var(--bg);min-height:100vh}

/* top bar */
.topbar{position:sticky;top:0;z-index:10;background:#fff;display:flex;align-items:center;gap:26px;padding:12px 36px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar>b{font-size:17px}
.topbar nav{display:flex;gap:26px;margin-inline-start:24px;flex-wrap:wrap}
.topbar nav a,.topbar nav button{font:inherit;font-weight:700;color:var(--mute);text-decoration:none;background:none;border:0;border-bottom:3px solid transparent;padding:6px 0;cursor:pointer;position:relative}
.topbar nav a:hover,.topbar nav button:hover{color:var(--gold-d)}
.topbar nav .on{color:var(--gold-d);border-bottom-color:var(--gold)}
.clock{margin-inline-start:auto;display:flex;flex-direction:column;line-height:1.4;padding-inline-end:20px;border-inline-end:1px solid var(--line);text-align:end}
.clock b{font-size:17px;color:var(--gold-d)}
.clock span{font-size:12.5px;color:var(--mute)}
.who{display:flex;align-items:center;gap:10px}
.who b{font-size:13px}
.who i{width:38px;height:38px;border-radius:50%;background:var(--gold-d);color:#fff;display:grid;place-items:center;font-weight:800;font-style:normal}

/* banner */
.banner{position:relative;background:linear-gradient(110deg,#E9C766,#C99A2E 55%,#9C7218);padding:48px 56px 118px;overflow:hidden;display:flex;align-items:center;gap:40px}
/* IQCMP lattice, redrawn as one seamless inline tile (92.063 x 368.252) and used as a mask so it can be tinted */
.banner .pat,.banner .sheen{position:absolute;inset:0;pointer-events:none;-webkit-mask-image:var(--tile);mask-image:var(--tile);-webkit-mask-size:92.063px 368.252px;mask-size:92.063px 368.252px;-webkit-mask-repeat:repeat;mask-repeat:repeat}
.banner .pat{background:#fff;opacity:.42;
  -webkit-mask-image:var(--tile),radial-gradient(ellipse 70% 140% at 50% 50%,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 35%,#000 100%);
  mask-image:var(--tile),radial-gradient(ellipse 70% 140% at 50% 50%,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 35%,#000 100%);
  -webkit-mask-size:92.063px 368.252px,100% 100%;mask-size:92.063px 368.252px,100% 100%;
  -webkit-mask-repeat:repeat,no-repeat;mask-repeat:repeat,no-repeat;
  -webkit-mask-composite:source-in;mask-composite:intersect}
.banner .sheen{background:linear-gradient(100deg,transparent 35%,#fff 50%,transparent 65%) no-repeat;background-size:60% 100%;opacity:.8;animation:sweep 5s ease-in-out infinite}
.banner .star{position:absolute;width:9px;height:9px;background:var(--gold-l);transform:rotate(45deg);animation:twinkle 3s ease-in-out infinite;pointer-events:none}
.medal{position:relative;width:200px;height:240px;border-radius:100px 100px 14px 14px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 0 0 5px #FFF8E0,0 0 0 7px var(--gold-d)}
.medal img{width:170px;height:170px;object-fit:contain}
.hello{position:relative;color:#fff;min-width:0}
.hello .greet{font-weight:800;font-size:18px;color:var(--gold-l)}
.hello h1{font-family:Amiri,serif;font-size:56px;line-height:1.3;margin:6px 0 0;font-weight:700;text-shadow:0 2px 12px #5A3F0A66}
.hello p{font-size:17px;margin:8px 0 0;color:var(--gold-l)}

/* stats */
.stats{margin:-66px 56px 0;position:relative;background:#fff;border-radius:18px;box-shadow:0 14px 40px #8A641833;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-bottom:5px solid var(--gold);overflow:hidden}
.stat{padding:20px 26px;text-align:center;border:0;background:none;font:inherit;color:inherit;display:block;width:100%}
.stat+.stat{border-inline-start:1px solid var(--line2)}
.stat .n{display:block;font-family:Amiri,serif;font-size:58px;line-height:1.3;color:var(--gold-d)}
.stat b{display:block}

/* apps */
.apps{padding:30px 56px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;scroll-margin-top:70px}
.app{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 24px #8A64181c;overflow:hidden}
.app .bar{position:absolute;top:0;inset-inline:0;height:5px}
.app .head{display:flex;align-items:flex-start;justify-content:space-between}
.app .ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;box-shadow:0 8px 18px #8A64182e}
.pill{font-size:12px;font-weight:800;border-radius:20px;padding:2px 12px;background:var(--ok-bg);color:var(--ok-fg)}
.pill.new{background:var(--soft);color:var(--gold-d)}
.app h3{font-size:16.5px;line-height:1.5;display:block;margin:0}
.app p{margin:4px 0 0;font-size:13px;line-height:1.7;color:var(--mute)}
.open{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:var(--gold-d);color:#fff;font-weight:800;font-size:14px;padding:11px 16px;border-radius:12px;transition:background .15s}
.open:hover,.open:focus-visible{background:var(--gold);color:#fff}
.open.off{background:#CDBF9A;cursor:not-allowed;pointer-events:none}

/* reports */
.reports{margin:22px 56px 40px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 22px;scroll-margin-top:70px}
.reports h2{margin:14px 0 4px;font-size:19px;color:var(--gold-d)}
.row{display:grid;grid-template-columns:130px 1fr 140px;gap:16px;padding:13px 0;border-bottom:1px solid var(--line2);align-items:center}
.row:last-child{border-bottom:0}
.row .per{color:var(--gold-d);font-weight:700}
.row small{color:var(--mute)}


@keyframes sweep{from{background-position:120% 0}to{background-position:-20% 0}}
@keyframes twinkle{0%,100%{opacity:.1;transform:rotate(45deg) scale(.6)}50%{opacity:.95;transform:rotate(45deg) scale(1.2)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

@media(max-width:900px){
  .topbar{padding:10px 20px;gap:14px}
  .topbar nav{margin-inline-start:0;gap:18px;order:3;width:100%}
  .clock{flex:1 1 100%;flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:2px 12px;margin-inline-start:0;padding:0;border:0;text-align:start}
  .banner{padding:32px 24px 100px;flex-direction:column;text-align:center;gap:24px}
  .hello h1{font-size:38px}
  .stats,.apps,.reports{margin-inline:20px}
  .apps{padding-inline:0}
  .stat{padding:16px}
  .stat .n{font-size:44px}
  .stat:nth-child(odd){border-inline-start:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line2)}
  .row{grid-template-columns:1fr;gap:4px}
}
@media(max-width:480px){.topbar nav{gap:14px;flex-wrap:nowrap;justify-content:space-between}.hello h1{font-size:30px}.medal{width:170px;height:204px;border-radius:85px 85px 14px 14px}.medal img{width:140px;height:140px}}
</style>
</head>
<body>
<div class="page">

<div class="topbar">
  <b>وزارة الأوقاف المصرية</b>
  <nav aria-label="التنقل الرئيسي">
    <a href="#top" class="on">الرئيسية</a>
    <a href="#apps">التطبيقات</a>
    <a href="#reports">التقارير</a>
  </nav>
  <div class="clock" aria-label="التاريخ والوقت"><b id="time"></b><span id="gdate"></span><span id="hdate"></span></div>
  <div class="who"><b>معالي وزير الأوقاف</b><i aria-hidden="true">م</i></div>
</div>

<section class="banner" id="top">
  <div class="pat"></div><div class="sheen"></div>
  <i class="star" style="left:8%;top:20%"></i>
  <i class="star" style="left:22%;top:70%;animation-duration:4s;animation-delay:.5s"></i>
  <i class="star" style="left:35%;top:35%;animation-duration:5s;animation-delay:1s"></i>
  <i class="star" style="left:48%;top:82%;animation-delay:1.5s"></i>
  <i class="star" style="left:60%;top:18%;animation-duration:4s;animation-delay:2s"></i>
  <i class="star" style="left:72%;top:60%;animation-duration:5s;animation-delay:2.5s"></i>
  <i class="star" style="left:85%;top:30%;animation-delay:3s"></i>
  <i class="star" style="left:93%;top:78%;animation-duration:4s;animation-delay:3.5s"></i>
  <div class="medal"><img src="logo.jpg" alt="شعار وزارة الأوقاف المصرية"></div>
  <div class="hello">
    <div class="greet">مرحبًا بمعالي الوزير</div>
    <h1>التحول الرقمي يتقدّم… وإنجازاته بين يديكم</h1>
    <p>آخر ما أضافه مكتب مساعد الوزير من تطبيقات وتقارير نجاح</p>
  </div>
</section>

<section class="stats" aria-label="مؤشرات سريعة">
  <div class="stat"><span class="n" id="nApps">٤</span><b>أهم التطبيقات</b></div>
  <div class="stat"><span class="n" id="nUsers">٤٥٠٠</span><b>إجمالي المستخدمين</b></div>
  <div class="stat"><span class="n" id="nTotalApps">١٢</span><b>إجمالي التطبيقات</b></div>
  <div class="stat"><span class="n" id="nReps">٣</span><b>تقارير النجاح</b></div>
</section>

<section class="apps" id="apps" aria-label="أهم التطبيقات"></section>

<section class="reports" id="reports" aria-labelledby="repH">
  <h2 id="repH">تقارير النجاح الدورية</h2>
  <div id="repList"></div>
</section>

</div>

<script>
(function () {
  var P = 'awqaf_';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var ar = function (n) { return Number(n).toLocaleString('ar-EG', { useGrouping: false }); };
  var rd = function (n) { try { return JSON.parse(localStorage.getItem(P + n)) || []; } catch (e) { return []; } };

  var ICON = {
    kpi: '<path d="M3 20h18M6 16V10M11 16V6M16 16v-4M21 16V8"/>',
    book: '<path d="M12 6c-2-2-5-2-8-1v13c3-1 6-1 8 1 2-2 5-2 8-1V5c-3-1-6-1-8 1zM12 6v13"/>',
    mosque: '<path d="M12 3c-3 3-6 4-6 8h12c0-4-3-5-6-8zM5 11v10h14V11M12 21v-5"/>',
    move: '<path d="M4 8h13l-3-3M20 16H7l3 3"/>',
    grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'
  };
  var GRAD = {
    gold: 'linear-gradient(135deg,#E3B84F,#9C7218)',
    bronze: 'linear-gradient(135deg,#9C7218,#5C430C)',
    red: 'linear-gradient(135deg,#E0384F,#9E0C22)',
    dark: 'linear-gradient(135deg,#6B5522,#2B2108)'
  };
  // colour keys written by the assistant page → 3a gradients
  var COLOR = { blue: GRAD.gold, ok: GRAD.bronze, warn: GRAD.red, plum: GRAD.dark };

  // ministry-wide totals (not derived from the cards below)
  var TOTAL_APPS = 12, TOTAL_USERS = 4500;

  var BASE_APPS = [
    { name: 'منظومة مؤشرات الأداء الاستراتيجية', url: 'https://awkaf.Strategizeit.us', desc: 'متابعة المؤشرات الرئيسية للوزارة ومقارنتها بالمستهدف.', g: GRAD.gold, icon: 'kpi', status: 'يعمل' },
    { name: 'المسابقة العالمية للقرآن الكريم', url: 'https://contest.strategizeit.us/ar/login', desc: 'إدارة التسجيل والتحكيم والنتائج للمسابقة.', g: GRAD.bronze, icon: 'book', status: 'يعمل' },
    { name: 'منظومة إدخال بيانات المساجد', url: 'https://awaf-mosques.strategizeit.us/login', desc: 'حصر المساجد وحالتها ومتابعة التحديث من المديريات.', g: GRAD.red, icon: 'mosque', status: 'محدَّث حديثًا' },
    { name: 'منظومة التنقلات والتعيينات', url: 'https://transfer.strategizeit.us/', desc: 'طلبات النقل والتعيين ومسار اعتمادها حتى القرار.', g: GRAD.dark, icon: 'move', status: 'يعمل' }
  ];
  var BASE_REPS = [
    { period: 'الربع الثالث', title: 'إنجازات منظومة المساجد', att: '٦ صور · فيديو' },
    { period: 'سبتمبر ٢٠٢٦', title: 'نتائج المسابقة العالمية للقرآن', att: '١٢ صورة · فيديو' },
    { period: 'الربع الثاني', title: 'مؤشرات الأداء الاستراتيجية', att: '٣ صور' }
  ];

  function appCard(a) {
    var url = a.url && a.url !== '#' ? a.url : '';
    var link = url
      ? '<a class="open" href="' + esc(url) + '" target="_blank" rel="noopener">'
      : '<a class="open off" aria-disabled="true" role="link" tabindex="-1">';
    return '<article class="app"><div class="bar" style="background:' + a.g + '"></div>' +
      '<div class="head"><div class="ico" style="background:' + a.g + '"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[a.icon] + '</svg></div>' +
      '<span class="pill' + (a.status === 'يعمل' ? '' : ' new') + '">' + esc(a.status) + '</span></div>' +
      '<div><h3>' + esc(a.name) + '</h3><p>' + esc(a.desc) + '</p></div>' +
      link + 'فتح التطبيق<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a></article>';
  }

  function render() {
    var apps = rd('apps').sort(function (a, b) { return b.ts - a.ts; }),
        reps = rd('reports').sort(function (a, b) { return b.ts - a.ts; });

    var added = apps.map(function (a) {
      return { name: a.name, desc: a.desc || '', g: COLOR[a.color] || GRAD.gold, icon: 'grid', status: 'جديد', url: a.url };
    });
    $('apps').innerHTML = added.concat(BASE_APPS).map(appCard).join('');

    var addedR = reps.map(function (r) {
      var n = (r.files || []).length;
      return { period: r.period || '—', title: r.title, att: n ? ar(n) + ' مرفقات' : 'بدون مرفقات' };
    });
    $('repList').innerHTML = addedR.concat(BASE_REPS).map(function (r) {
      return '<div class="row"><b class="per">' + esc(r.period) + '</b><b>' + esc(r.title) + '</b><small>' + esc(r.att) + '</small></div>';
    }).join('');

    $('nApps').textContent = ar(added.length + BASE_APPS.length);
    $('nReps').textContent = ar(addedR.length + BASE_REPS.length);
    $('nTotalApps').textContent = ar(TOTAL_APPS);
    $('nUsers').textContent = ar(TOTAL_USERS);
  }

  // nav highlight follows the section in view
  var links = document.querySelectorAll('.topbar nav a');
  links.forEach(function (l) {
    l.addEventListener('click', function () {
      links.forEach(function (x) { x.classList.remove('on'); });
      l.classList.add('on');
    });
  });

  function tick() {
    var d = new Date();
    try {
      $('time').textContent = d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
      $('gdate').textContent = d.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      $('hdate').textContent = d.toLocaleDateString('ar-EG-u-ca-islamic-umalqura', { day: 'numeric', month: 'long', year: 'numeric' });
    } catch (e) {}
  }
  tick();
  setInterval(tick, 15000);

  window.addEventListener('storage', render);
  render();
})();
</script>
</body>
</html>
